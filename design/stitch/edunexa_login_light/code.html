<style>
        body { font-family: 'Geist', sans-serif; overflow: hidden; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        /* Floating background elements */
        .float-container { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .floating-obj { position: absolute; opacity: 0.15; filter: blur(2px); transition: transform 0.5s ease-out; }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 40px -10px rgba(70, 72, 212, 0.1);
        }
        
        input:focus {
            box-shadow: 0 0 0 4px rgba(70, 72, 212, 0.15);
        }

        .login-btn-gradient {
            background: linear-gradient(135deg, #4648d4 0%, #6b38d4 100%);

</div>
</div>

<script>
        // Micro-interactions for floating background
        document.addEventListener('mousemove', (e) => {
            const objs = document.querySelectorAll('.floating-obj');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            
            objs.forEach((obj, index) => {
                const speed = (index + 1) * 0.2;
                obj.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
