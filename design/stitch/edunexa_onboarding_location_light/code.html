<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduNexa Onboarding - Location &amp; Contact</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .stepper-progress {
            width: 40%; /* Step 2 of 5 */
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .input-focus-halo:focus-within {
            border-color: #4648d4;
            box-shadow: 0 0 0 4px rgba(70, 72, 210, 0.15);
        }

        @keyframes slideInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-slide-up {
            animation: slideInUp 0.5s ease-out forwards;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#4648d4",
                        "tertiary-container": "#00885d",
                        "surface-bright": "#f8f9ff",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary-fixed-variant": "#005236",
                        "outline": "#767586",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#fffbff",
                        "background": "#f8f9ff",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-tertiary-container": "#000703",
                        "on-primary-fixed": "#07006c",
                        "on-surface-variant": "#464554",
                        "primary-container": "#6063ee",
                        "error-container": "#ffdad6",
                        "on-surface": "#0b1c30",
                        "secondary-container": "#8455ef",
                        "on-secondary-container": "#fffbff",
                        "inverse-primary": "#c0c1ff",
                        "surface-variant": "#d3e4fe",
                        "surface-dim": "#cbdbf5",
                        "on-tertiary-fixed": "#002113",
                        "surface-container-low": "#eff4ff",
                        "secondary-fixed": "#e9ddff",
                        "surface-tint": "#494bd6",
                        "on-secondary": "#ffffff",
                        "surface-container": "#e5eeff",
                        "on-error": "#ffffff",
                        "secondary": "#6b38d4",
                        "tertiary": "#006c49",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#d0bcff",
                        "outline-variant": "#c7c4d7",
                        "error": "#ba1a1a",
                        "on-background": "#0b1c30",
                        "inverse-surface": "#213145",
                        "on-secondary-fixed": "#23005c",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "on-secondary-fixed-variant": "#5516be",
                        "primary-fixed": "#e1e0ff",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#4edea3",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-container-high": "#dce9ff",
                        "surface": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "sidebar-width": "280px",
                        "container-padding": "32px",
                        "card-gap": "24px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "title-md": ["Geist"],
                        "headline-lg-mobile": ["Geist"],
                        "headline-lg": ["Geist"],
                        "body-md": ["Geist"],
                        "display-lg": ["Geist"],
                        "label-sm": ["Geist"]
                    },
                    "fontSize": {
                        "title-md": ["20px", {"lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-24">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant/30 shadow-sm flex items-center justify-between px-6 h-20">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl">school</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">EduNexa</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant">dark_mode</span>
</button>
</header>
<main class="mt-20 px-6 pt-8 max-w-md mx-auto">
<!-- Stepper Indicator -->
<div class="mb-8 animate-slide-up">
<div class="flex justify-between items-end mb-3">
<div>
<p class="font-label-sm text-primary uppercase tracking-wider mb-1">Onboarding Journey</p>
<h2 class="font-title-md text-title-md text-on-surface">Location &amp; Contact</h2>
</div>
<span class="font-label-sm text-outline">Step 2 of 5</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-primary to-secondary stepper-progress rounded-full"></div>
</div>
</div>
<!-- Form Section -->
<div class="space-y-6 animate-slide-up" style="animation-delay: 0.1s;">
<!-- Section Header -->
<div class="flex items-center gap-3 mb-2">
<div class="w-8 h-8 rounded-lg bg-primary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-xl">location_on</span>
</div>
<h3 class="font-title-md text-on-surface">Institutional Address</h3>
</div>
<!-- Address Field -->
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant px-1">Street Address</label>
<div class="input-focus-halo border border-outline-variant rounded-xl bg-surface-container-lowest transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 py-3.5 px-4 text-on-surface placeholder:text-outline/50" placeholder="e.g. 123 Education Way" type="text"/>
</div>
</div>
<!-- City & State Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant px-1">City</label>
<div class="input-focus-halo border border-outline-variant rounded-xl bg-surface-container-lowest transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 py-3.5 px-4 text-on-surface placeholder:text-outline/50" placeholder="London" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant px-1">State / Province</label>
<div class="input-focus-halo border border-outline-variant rounded-xl bg-surface-container-lowest transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 py-3.5 px-4 text-on-surface placeholder:text-outline/50" placeholder="Greater London" type="text"/>
</div>
</div>
</div>
<!-- Country & Postal Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant px-1">Country</label>
<div class="input-focus-halo border border-outline-variant rounded-xl bg-surface-container-lowest transition-all">
<select class="w-full bg-transparent border-none focus:ring-0 py-3.5 px-4 text-on-surface appearance-none">
<option>United Kingdom</option>
<option>United States</option>
<option>Canada</option>
<option>Australia</option>
</select>
</div>
</div>
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant px-1">Postal Code</label>
<div class="input-focus-halo border border-outline-variant rounded-xl bg-surface-container-lowest transition-all">
<input class="w-full bg-transparent border-none focus:ring-0 py-3.5 px-4 text-on-surface placeholder:text-outline/50" placeholder="EC1A 1BB" type="text"/>
</div>
</div>
</div>
<hr class="border-outline-variant/30 my-8"/>
<!-- Contact Header -->
<div class="flex items-center gap-3 mb-2">
<div class="w-8 h-8 rounded-lg bg-secondary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-xl">contact_support</span>
</div>
<h3 class="font-title-md text-on-surface">Contact Information</h3>
</div>
<!-- Phone Field -->
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant px-1">Institutional Phone</label>
<div class="input-focus-halo border border-outline-variant rounded-xl bg-surface-container-lowest flex items-center transition-all">
<span class="material-symbols-outlined text-outline px-4">call</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3.5 pr-4 pl-0 text-on-surface placeholder:text-outline/50" placeholder="+44 20 7946 0000" type="tel"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant px-1">Primary Admin Email</label>
<div class="input-focus-halo border border-outline-variant rounded-xl bg-surface-container-lowest flex items-center transition-all">
<span class="material-symbols-outlined text-outline px-4">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3.5 pr-4 pl-0 text-on-surface placeholder:text-outline/50" placeholder="admin@university.edu" type="email"/>
</div>
</div>
<!-- Website Field -->
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant px-1">Institutional Website</label>
<div class="input-focus-halo border border-outline-variant rounded-xl bg-surface-container-lowest flex items-center transition-all">
<span class="material-symbols-outlined text-outline px-4">language</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3.5 pr-4 pl-0 text-on-surface placeholder:text-outline/50" placeholder="https://www.university.edu" type="url"/>
</div>
</div>
<!-- Contextual Tip Card -->
<div class="glass-card rounded-2xl p-4 mt-8 border-primary/10 bg-primary/5 flex gap-4">
<span class="material-symbols-outlined text-primary">lightbulb</span>
<div>
<h4 class="font-label-sm text-primary mb-1">Pro Tip</h4>
<p class="text-sm text-on-surface-variant leading-relaxed">Providing a verified institutional domain helps expedite your accreditation check during Step 4.</p>
</div>
</div>
</div>
</main>
<!-- Bottom Action Bar (Fixed for Mobile) -->
<footer class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-lg border-t border-outline-variant/30 px-6 py-4 flex items-center gap-4 z-50">
<button class="flex-1 h-14 rounded-xl border border-outline-variant font-title-md text-on-surface-variant active:scale-95 transition-transform">
            Back
        </button>
<button class="flex-[2] h-14 rounded-xl bg-gradient-to-r from-primary to-secondary text-on-primary font-title-md shadow-lg shadow-primary/20 active:scale-95 transition-all">
            Save and Continue
        </button>
</footer>
<!-- Simple JS for hydration/scroll effects -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input, select');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.classList.add('ring-2', 'ring-primary/10');
                });
                input.addEventListener('blur', () => {
                    input.parentElement.classList.remove('ring-2', 'ring-primary/10');
                });
            });

            // Handle back button click to simulate flow
            const backBtn = document.querySelector('button:contains("Back")');
            if (backBtn) {
                backBtn.addEventListener('click', () => {
                    window.history.back();
                });
            }
        });

        // Helper for selector
        if (!Element.prototype.containsText) {
            window.addEventListener('click', (e) => {
                if(e.target.innerText === 'Back') {
                    console.log('Navigating back...');
                }
            });
        }
    </script>
</body></html>
