<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

                        "on-secondary-container": "#fffbff",

                        "on-secondary-fixed-variant": "#5516be",
                        "primary-fixed": "#e1e0ff",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#4edea3",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-container-high": "#dce9ff",

                    },
                    "borderRadius": {

                    "spacing": {

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .step-active {
            box-shadow: 0 0 15px rgba(70, 72, 212, 0.3);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-20 overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant/30 shadow-sm flex items-center justify-between px-6 h-20 max-w-screen-2xl mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl">school</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">EduNexa</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full active:scale-95 transition-transform hover:bg-surface-container">
<span class="material-symbols-outlined text-on-surface-variant">dark_mode</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="mt-20 px-4 pt-6 max-w-lg mx-auto">
<!-- Premium Stepper -->
<div class="mb-8">
<div class="flex items-center justify-between mb-4">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-widest">Step 3 of 5</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Academic Structure</span>
</div>
<div class="flex gap-2 h-1.5 w-full">
<div class="h-full flex-1 bg-primary rounded-full"></div>
<div class="h-full flex-1 bg-primary rounded-full"></div>
<div class="h-full flex-1 bg-primary rounded-full relative overflow-hidden">
<div class="absolute inset-0 bg-white/30 animate-[pulse_2s_infinite]"></div>
</div>
<div class="h-full flex-1 bg-surface-container-highest rounded-full"></div>
<div class="h-full flex-1 bg-surface-container-highest rounded-full"></div>
</div>
</div>
<!-- Form Section: Academic Structure -->
<section class="space-y-6">
<header class="mb-4">
<h2 class="font-title-md text-title-md text-on-surface">Set your Foundation</h2>
<p class="text-sm text-on-surface-variant mt-1">Configure how your institution organizes its educational year and curriculum.</p>
</header>
<!-- Academic Session -->
<div class="glass-card rounded-2xl p-4 shadow-sm">
<div class="flex items-center justify-between mb-3">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1.5">
<span class="material-symbols-outlined text-sm">event</span> ACADEMIC SESSION
                    </label>
<button class="group relative">
<span class="material-symbols-outlined text-outline text-lg">help_outline</span>
<div class="absolute bottom-full right-0 mb-2 w-48 p-2 bg-inverse-surface text-inverse-on-surface text-[10px] rounded-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10">
                            The current operational year (e.g., 2024-2025).
                        </div>
</button>
</div>
<select class="w-full bg-surface border-outline-variant/50 rounded-xl px-4 py-3 text-on-surface focus:ring-4 focus:ring-primary/15 focus:border-primary transition-all appearance-none outline-none">
<option>2023 - 2024</option>
<option selected="">2024 - 2025</option>
<option>2025 - 2026</option>
</select>
</div>
<!-- Classes & Sections Bento Card -->
<div class="grid grid-cols-2 gap-4">
<div class="glass-card rounded-2xl p-4 shadow-sm flex flex-col justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-3">CLASSES</label>
<div class="flex items-end justify-between">
<span class="text-3xl font-bold text-primary">12</span>
<button class="bg-primary-container text-on-primary-container p-2 rounded-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<div class="glass-card rounded-2xl p-4 shadow-sm flex flex-col justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-3">SECTIONS</label>
<div class="flex items-end justify-between">
<span class="text-3xl font-bold text-secondary">36</span>
<button class="bg-secondary-container text-on-secondary-container p-2 rounded-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined">auto_awesome_motion</span>
</button>
</div>
</div>
</div>
<!-- Subjects Chip List -->
<div class="glass-card rounded-2xl p-5 shadow-sm">
<div class="flex items-center justify-between mb-4">
<label class="font-label-sm text-label-sm text-on-surface-variant">CORE SUBJECTS</label>
<span class="text-[10px] bg-tertiary/10 text-tertiary px-2 py-0.5 rounded-full font-bold">8 ACTIVE</span>
</div>
<div class="flex flex-wrap gap-2">
<div class="flex items-center gap-1 bg-surface-container border border-outline-variant/30 px-3 py-1.5 rounded-full text-xs">
<span>Mathematics</span>
<span class="material-symbols-outlined text-xs cursor-pointer hover:text-error">close</span>
</div>
<div class="flex items-center gap-1 bg-surface-container border border-outline-variant/30 px-3 py-1.5 rounded-full text-xs">
<span>Science</span>
<span class="material-symbols-outlined text-xs cursor-pointer hover:text-error">close</span>
</div>
<div class="flex items-center gap-1 bg-surface-container border border-outline-variant/30 px-3 py-1.5 rounded-full text-xs text-primary font-medium border-primary/30">
<span class="material-symbols-outlined text-xs">add</span>
<span>Add Subject</span>
</div>
</div>
</div>
<!-- Grading System Selector -->
<div class="glass-card rounded-2xl p-4 shadow-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-4">GRADING SYSTEM</label>
<div class="space-y-3">
<label class="flex items-center justify-between p-3 rounded-xl border border-primary bg-primary/5 cursor-pointer">
<div class="flex items-center gap-3">
<div class="w-5 h-5 rounded-full border-4 border-primary flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-white"></div>
</div>
<span class="text-sm font-medium">CGPA (10 Point)</span>
</div>
<span class="material-symbols-outlined text-primary">verified</span>
<input checked="" class="hidden" name="grading" type="radio"/>
</label>
<label class="flex items-center justify-between p-3 rounded-xl border border-outline-variant/50 hover:bg-surface-container-low cursor-pointer transition-colors">
<div class="flex items-center gap-3">
<div class="w-5 h-5 rounded-full border-2 border-outline"></div>
<span class="text-sm">Percentage (%)</span>
</div>
<input class="hidden" name="grading" type="radio"/>
</label>
</div>
</div>
<!-- Working Days -->
<div class="glass-card rounded-2xl p-4 shadow-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-4 uppercase">Working Days</label>
<div class="flex justify-between items-center">
<button class="w-9 h-9 rounded-full bg-primary text-white text-xs font-bold shadow-md shadow-primary/20">M</button>
<button class="w-9 h-9 rounded-full bg-primary text-white text-xs font-bold shadow-md shadow-primary/20">T</button>
<button class="w-9 h-9 rounded-full bg-primary text-white text-xs font-bold shadow-md shadow-primary/20">W</button>
<button class="w-9 h-9 rounded-full bg-primary text-white text-xs font-bold shadow-md shadow-primary/20">T</button>
<button class="w-9 h-9 rounded-full bg-primary text-white text-xs font-bold shadow-md shadow-primary/20">F</button>
<button class="w-9 h-9 rounded-full border border-outline-variant text-outline text-xs font-bold">S</button>
<button class="w-9 h-9 rounded-full border border-outline-variant text-outline text-xs font-bold">S</button>
</div>
</div>
</section>
<!-- Navigation Actions -->
<div class="mt-10 flex flex-col gap-3">
<button class="w-full py-4 rounded-2xl bg-gradient-to-r from-primary to-secondary text-white font-bold text-lg shadow-lg shadow-primary/25 active:scale-[0.98] transition-transform">
                Save and Continue
            </button>
<button class="w-full py-4 rounded-2xl border border-outline-variant text-on-surface-variant font-medium flex items-center justify-center gap-2 active:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-lg">arrow_back</span>
                Back
            </button>
</div>
<!-- Visual Decorative Backdrop (Glassmorphism Effect) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-40">
<div class="absolute top-20 right-[-10%] w-64 h-64 rounded-full bg-primary/20 blur-[100px]"></div>
<div class="absolute bottom-40 left-[-10%] w-80 h-80 rounded-full bg-secondary/10 blur-[120px]"></div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/90 backdrop-blur-lg border-t border-outline-variant/30 shadow-lg flex justify-around items-center h-16 px-4">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-opacity" href="#">
<span class="material-symbols-outlined">login</span>
<span class="font-label-sm text-[10px]">Login</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-2xl px-4 py-1" href="#">
<span class="material-symbols-outlined">help</span>
<span class="font-label-sm text-[10px]">Support</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-opacity" href="#">
<span class="material-symbols-outlined">info</span>
<span class="font-label-sm text-[10px]">About</span>
</a>
</nav>
<script>
        // Micro-interaction for working day toggles
        document.querySelectorAll('button.w-9').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('bg-primary')) {
                    this.classList.remove('bg-primary', 'text-white', 'shadow-md', 'shadow-primary/20');
                    this.classList.add('border', 'border-outline-variant', 'text-outline');
                } else {
                    this.classList.remove('border', 'border-outline-variant', 'text-outline');
                    this.classList.add('bg-primary', 'text-white', 'shadow-md', 'shadow-primary/20');
                }
            });
        });

        // Grading system radio selection simulation
        const gradingRadios = document.querySelectorAll('input[name="grading"]');
        gradingRadios.forEach(radio => {
            radio.closest('label').addEventListener('click', () => {
                // Reset all
                document.querySelectorAll('input[name="grading"]').forEach(r => {
                    const parent = r.closest('label');
                    parent.classList.remove('border-primary', 'bg-primary/5');
                    parent.classList.add('border-outline-variant/50');
                    const dot = parent.querySelector('.w-5');
                    dot.classList.remove('border-4', 'border-primary');
                    dot.classList.add('border-2', 'border-outline');
                    const badge = parent.querySelector('.material-symbols-outlined:not(.text-sm)');
                    if(badge && badge.textContent === 'verified') badge.classList.add('hidden');
                });
                // Activate current
                const activeLabel = radio.closest('label');
                activeLabel.classList.add('border-primary', 'bg-primary/5');
                activeLabel.classList.remove('border-outline-variant/50');
                const activeDot = activeLabel.querySelector('.w-5');
                activeDot.classList.add('border-4', 'border-primary');
                activeDot.classList.remove('border-2', 'border-outline');
                const activeBadge = activeLabel.querySelector('.material-symbols-outlined:not(.text-sm)');
                if(activeBadge) activeBadge.classList.remove('hidden');
            });
        });
    </script>
</body></html>
